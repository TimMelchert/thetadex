<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <mask id="maul-rand" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><rect width="64" height="64" fill="#fff"/><path d="M14.87 11.75 L7.66 4.54 L4.54 7.66 L11.75 14.87 Z" fill="#000"/></mask>
    <mask id="maul" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><rect width="64" height="64" fill="#fff"/><path d="M17.4 11.8 L8.9 3.3 L3.3 8.9 L11.8 17.4 Z" fill="#000"/></mask>
